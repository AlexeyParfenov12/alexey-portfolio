.linkrow:hover,
.linkrow:focus-visible { color: var(--text) !important; }

.linkrow strong,

/* v4.2: контраст и предсказуемое наследование текста на светлых поверхностях */
:root { color-scheme: light; }
input::placeholder, textarea::placeholder { color: #526960; opacity: 1; }
.card, .section, .table, .tablewrap, .paper, .modal, .editor-side, .board-inspector, .board-foot, .board-status, .board-toolbar { color: var(--text); }
.board-obj .objmenu, .board-obj .objmenu button, .board-toolbar button, .board-status button, .framechip { color: var(--text); }
.board-toolbar button.active, .board-toolbar button:hover { color: var(--primary); }
.board-live .board-head { color: #ffffff; }
.board-live .board-head .board-title { color: var(--text); }
/* Светлые элементы не должны наследовать белый цвет от режима показа. */
.board-live .board-head .iconbtn, .board-live .board-head .btn:not(.primary) { color: var(--deep); }

<div id="app" class="app"><aside class="sidebar"><div class="brand"><span class="brandmark">◈</span><span><b>College Ecosystem</b><small>Единая среда колледжа</small></span></div><nav id="nav"></nav><div class="asidefoot">Демонстрационная среда<br><small>Данные в этом браузере</small></div></aside><div class="topbar"><button class="iconbtn" id="backBtn" title="Назад">←</button><span id="breadcrumb">College Learning</span><span class="grow"></span><span class="save-status" id="saveStatus">● Локальное сохранение</span><select id="roleSelect" title="Роль"><option value="teacher">Преподаватель</option><option value="student">Студент</option></select><button class="iconbtn" id="helpBtn" title="Помощь">?</button></div><main id="view"></main></div><div id="toast" role="status"></div><div id="modalRoot"></div><script>/* College Ecosystem — interactive local prototype; no server integration */
(()=>{'use strict';
const STORAGE='college-learning-working-v4';const $=(s,root=document)=>root.querySelector(s);const $$=(s,root=document)=>[...root.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>('id'+Math.random().toString(36).slice(2,9));
const initial=()=>({role:'teacher',route:'overview',subjectId:'s1',materialId:'m1',tab:'content',boardId:'b1',tool:'select',zoom:1,panX:110,panY:70,chosen:null,live:false,answers:{},currentQuestion:0,questionEditor:0,attempts:[],reviews:[],savedAt:null,materials:[{id:'m1',subjectId:'s1',type:'lecture',title:'Лекция № 4. Циклы Python',body:'Цикл — конструкция языка программирования, которая позволяет выполнять блок команд несколько раз.\n\nЦикл for применяется, когда известна последовательность или количество повторений.\n\nПример:\nfor i in range(5):\n    print(i)\n\nПосле объяснения откройте интерактивную доску и ответьте на вопрос.',published:true,format:'web'},{id:'m2',subjectId:'s1',type:'practice',title:'Практическая работа № 3. Циклы Python',body:'Цель: научиться использовать цикл for.\n\nЗадание: напишите программу, которая выводит числа от 1 до 20 включительно, каждое число — на отдельной строке.\n\nТребования: используйте цикл for; не выводите лишние символы.',answerType:'code',published:true,format:'web',maxScore:10},{id:'m3',subjectId:'s1',type:'lab',title:'Лабораторная работа № 2. Обработка данных',body:'Исследуйте зависимость электрического тока от напряжения. Заполните таблицу измерений, рассчитайте сопротивление по формуле R = U / I и сформулируйте вывод.',published:true,format:'web'},{id:'m4',subjectId:'s1',type:'quiz',title:'Тест. Условные операторы',body:'Проверка знаний по основам Python',published:true,format:'web',questions:[{id:uid(),text:'Что выведет print(2 ** 3)?',options:['6','8','9','Ничего'],correct:1},{id:uid(),text:'Какой оператор используется для условия?',options:['for','if','print','import'],correct:1},{id:uid(),text:'Какой цикл используется для перебора элементов?',options:['for','if','def','return'],correct:0}]},{id:'m5',subjectId:'s2',type:'lecture',title:'Лекция № 1. Реляционные базы данных',body:'Реляционная база данных организует информацию в таблицы. Строки представляют записи, столбцы — атрибуты.\n\nПервичный ключ помогает однозначно идентифицировать запись.',published:true,format:'web'}],subjects:[{id:'s1',name:'Основы программирования',group:'ИС-234',period:'1 семестр',code:'ОП.05'},{id:'s2',name:'Базы данных',group:'ИС-234',period:'1 семестр',code:'ОП.08'},{id:'s3',name:'Информационные технологии',group:'ИС-235',period:'2 семестр',code:'ОП.03'}],boards:[{id:'b1',subjectId:'s1',title:'Циклы Python — интерактивная доска',frames:[{id:'f1',title:'Введение'},{id:'f2',title:'Пример'},{id:'f3',title:'Опрос'}],objects:[{id:'o1',type:'frame',x:150,y:140,w:650,h:470,text:'Кадр 1 · Введение',fill:'#e6f5ef'}, {id:'o2',type:'text',x:195,y:200,w:410,h:80,text:'Циклы в Python',size:30,fill:'transparent'},{id:'o3',type:'sticky',x:200,y:320,w:185,h:130,text:'Цикл повторяет действия много раз',fill:'#fff1c7'},{id:'o4',type:'rect',x:450,y:325,w:265,h:95,text:'for i in range(5):\n    print(i)',fill:'#e0f5ec'},{id:'o5',type:'poll',x:880,y:210,w:310,h:230,text:'Какой оператор используют для повторения?\nfor | if | print',fill:'#fff'},{id:'o6',type:'frame',x:850,y:120,w:410,h:405,text:'Кадр 2 · Вопрос',fill:'#e6f5ef'}],strokes:[],poll:{text:'Какой оператор используют для повторения?',options:['for','if','print'],correct:0,votes:[],open:false,revealed:false},activeFrame:0}]});
let db;try{db=JSON.parse(localStorage.getItem(STORAGE))||initial()}catch{db=initial()}const fallback=initial();if(!db.boards||!db.materials){db=fallback}let temp={draft:{},snapshot:[],future:[],pointer:null,stroke:null,activeTab:'content',reviewStudent:'Иванов И. А.',quizSelection:null,quizDraft:null,search:'',isImport:false};const navs=[['overview','⌂','Обзор'],['subjects','▣','Предметы'],['tasks','☑','Задания'],['reviews','▤','Проверка работ'],['boardlist','✎','Доски'],['library','▤','Материалы']];
function persist(){try{db.savedAt=Date.now();localStorage.setItem(STORAGE,JSON.stringify(db));$('#saveStatus').textContent='● Сохранено в браузере'}catch(e){$('#saveStatus').textContent='● Ошибка сохранения';notify('Не удалось сохранить: '+e.message)}}function change(mut,render=true){mut();persist();if(render)draw()}function notify(msg){const el=$('#toast');el.textContent=msg;el.style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.style.display='none',3500)}function route(to){db.route=to;db.tab='content';persist();draw()}function button(label,act,cls=''){return `<button class="btn ${cls}" data-act="${esc(act)}">${label}</button>`}function title(s,sub,actions=''){return `<div class="pagetitle"><div><h1>${esc(s)}</h1>${sub?`<p class="page-sub">${esc(sub)}</p>`:''}</div><div class="flexwrap">${actions}</div></div>`}function pill(s){return `<span class="pill ${s==='Черновик'?'gray':''}">${esc(s)}</span>`}function matIcon(t){return ({lecture:'▤',practice:'✎',lab:'⚗',quiz:'☑',board:'▣',control:'▤',project:'◈'})[t]||'▤'}function matType(t){return ({lecture:'Лекция',practice:'Практическая работа',lab:'Лабораторная работа',quiz:'Тест',board:'Доска',control:'Контрольная работа',project:'Проект'})[t]||t}function getMat(){return db.materials.find(m=>m.id===db.materialId)||db.materials[0]}function getSubject(){return db.subjects.find(s=>s.id===db.subjectId)||db.subjects[0]}function getBoard(){return db.boards.find(b=>b.id===db.boardId)||db.boards[0]}function dataRow(icon,text,meta,act,right=''){return `<button class="linkrow" data-act="${act}"><span class="colicon">${icon}</span><span style="flex:1"><b>${esc(text)}</b><br><small>${esc(meta)}</small></span>${right}<span>›</span></button>`}function renderNav(){const teacher=db.role==='teacher';$('#nav').innerHTML=navs.filter(x=>teacher||!['reviews','library'].includes(x[0])).map(([r,i,l])=>`<button class="navbtn ${db.route===r||['subject','reader','materialedit','practice','lab','quiz','quizBuilder','report'].includes(db.route)&&r==='subjects'||['board','boardLive'].includes(db.route)&&r==='boardlist'?'active':''}" data-route="${r}"><span class="ico">${i}</span><span class="label">${l}</span></button>`).join('');$('#roleSelect').value=db.role;$('#breadcrumb').textContent=['board','boardLive'].includes(db.route)?'College Board':db.route==='overview'?'Обзор':getSubject().name}
function overview(){const teacher=db.role==='teacher';const first=getSubject();return `<div class="page">${title(teacher?'Рабочее пространство преподавателя':'Моё обучение',teacher?'Ваши занятия, предметы и работы студентов':'Предметы, материалы и задания на сегодня')}
<div class="card" style="margin-bottom:18px;background:linear-gradient(105deg,#fff,#ecf9f2)"><div class="row space"><div><small>${teacher?'Ближайшая пара':'Продолжить изучение'}</small><h2 style="margin:8px 0">${esc(first.name)}</h2><small>${esc(first.group)} · Сегодня, 10:10–11:40</small></div>${button(teacher?'Открыть занятие':'Перейти к предмету','openSubject','primary')}</div></div>
<div class="grid3" style="margin-bottom:20px"><div class="dashitem" data-act="subjects"><div class="colicon">▣</div><div><small>Мои предметы</small><br><b>${db.subjects.length}</b></div></div><div class="dashitem" data-act="${teacher?'reviews':'tasks'}"><div class="colicon">☑</div><div><small>${teacher?'На проверке':'Доступных заданий'}</small><br><b>${teacher?db.attempts.filter(a=>a.status==='submitted').length:db.materials.filter(x=>x.type==='practice'||x.type==='quiz').length}</b></div></div><div class="dashitem" data-act="boardlist"><div class="colicon">✎</div><div><small>Интерактивные доски</small><br><b>${db.boards.length}</b></div></div></div>
<h2>${teacher?'Недавние материалы':'Материалы предметов'}</h2><div class="card" style="padding:0">${db.materials.filter(x=>teacher||x.published).slice(0,5).map(m=>dataRow(matIcon(m.type),m.title,matType(m.type)+' · '+(m.published?'Опубликовано':'Черновик'),'material:'+m.id)).join('')}</div></div>`}
function subjects(){return `<div class="page">${title(db.role==='teacher'?'Предметы':'Мои предметы','Учебные дисциплины и материалы')}
<div class="card" style="padding:0">${db.subjects.map(s=>dataRow('▣',s.name,`${s.code} · ${s.group} · ${s.period}`,'subject:'+s.id)).join('')}</div></div>`}
function subject(){let s=getSubject();let mats=db.materials.filter(m=>m.subjectId===s.id&&(db.role==='teacher'||m.published));let teacher=db.role==='teacher';return `<div class="page">${title(s.name,s.code+' · '+s.group+' · '+s.period,teacher?button('+ Добавить материал','newMaterial','primary'):'')}<div class="tabs">${['Содержание','Задания','Результаты','О предмете'].map((x,i)=>`<button class="tab ${db.tab===['content','tasks','results','about'][i]?'active':''}" data-act="tab:${['content','tasks','results','about'][i]}">${x}</button>`).join('')}</div>${db.tab==='about'?`<div class="card"><h2>О предмете</h2><p>Учебная дисциплина ${esc(s.code)}, группа ${esc(s.group)}.</p><p>Материалы доступны в рамках учебного назначения.</p></div>`:db.tab==='results'?report():`<div class="section"><div class="section-title">Раздел 1. Основы ${esc(s.name)}</div>${mats.filter(m=>db.tab==='content'||m.type!=='lecture').map(m=>dataRow(matIcon(m.type),m.title,matType(m.type), 'material:'+m.id, teacher?pill(m.published?'Опубликовано':'Черновик'):'' )).join('')||'<div class="empty">Материалов пока нет</div>'}</div><div class="section"><div class="section-title">Интерактивные доски</div>${db.boards.filter(b=>b.subjectId===s.id).map(b=>dataRow('✎',b.title,`${b.frames.length} кадров`,'board:'+b.id)).join('')||'<p style="padding:15px">Досок пока нет</p>'}</div>`}</div>`}
function library(){return `<div class="page">${title('Библиотека материалов','Созданные лекции, практические, лабораторные и тесты',button('+ Создать материал','newMaterial','primary'))}<div class="card" style="padding:0">${db.materials.map(m=>dataRow(matIcon(m.type),m.title,matType(m.type)+' · '+(m.published?'Опубликовано':'Черновик'),'material:'+m.id)).join('')}</div></div>`}
function chooseMaterial(){return `<div class="page">${title('Новый учебный материал','Выберите тип материала. Формат оформления можно изменить позже.')}<div class="template-grid">${[['lecture','▤','Лекция','Текст, А4, сцены или смешанный формат'],['practice','✎','Практическая работа','Условие, ответ, проверка'],['lab','⚗','Лабораторная работа','Измерения, расчёты, вывод'],['quiz','☑','Тест','Банк вопросов и попытки'],['control','▤','Контрольная работа','Задания и варианты'],['project','◈','Проектная работа','Этапы, файлы и результаты']].map(([type,ico,name,sub])=>`<button class="card template" data-act="create:${type}"><span class="colicon">${ico}</span><b>${name}</b><small>${sub}</small></button>`).join('')}</div></div>`}
function materialLanding(){let m=getMat(),teacher=db.role==='teacher';return `<div class="page">${title(m.title,matType(m.type)+' · '+(m.published?'Опубликовано':'Черновик'),teacher?button('Редактировать','editMaterial')+button('Посмотреть как студент','openView','primary'):button(m.type==='quiz'?'Начать тест':m.type==='lecture'?'Читать лекцию':'Выполнить','openView','primary'))}<div class="card"><p style="white-space:pre-wrap">${esc(m.body)}</p><div class="toolbar">${teacher?button('Изменить','editMaterial')+button('Опубликовать','publishMaterial'):button('Открыть','openView','primary')}</div></div></div>`}
function materialEditor(){const m=getMat();if(m.type==='quiz')return quizBuilder();let active=temp.activeTab||'content';const tabs=['Содержание','Ответ студента','Оценивание','Назначение'];let isLecture=m.type==='lecture';return `<div class="page wide">${title('Редактор: '+m.title,matType(m.type)+' · '+(m.published?'Редактирование создаёт новую версию (в прототипе упрощено)':'Черновик'),button('Предпросмотр','openView')+button('Опубликовать','publishMaterial','primary'))}
<div class="toolbar">${isLecture?`<label>Представление <select id="formatSelect"><option value="web" ${m.format==='web'?'selected':''}>Веб-лекция</option><option value="a4" ${m.format==='a4'?'selected':''}>А4</option><option value="slides" ${m.format==='slides'?'selected':''}>Презентация</option><option value="mixed" ${m.format==='mixed'?'selected':''}>Смешанная</option></select></label>`:`<div class="tabs" style="margin:0">${tabs.map((x,i)=>`<button class="tab ${active===['content','answer','grading','assign'][i]?'active':''}" data-act="editorTab:${['content','answer','grading','assign'][i]}">${x}</button>`).join('')}</div>`}</div>
${active==='answer'&&!isLecture?`<div class="card" style="max-width:750px"><h2>Способ ответа студента</h2><div class="field"><label>Тип ответа</label><select id="answerType"><option value="text" ${m.answerType==='text'?'selected':''}>Текст</option><option value="code" ${m.answerType==='code'?'selected':''}>Редактор кода</option><option value="file" ${m.answerType==='file'?'selected':''}>Загрузка файла</option><option value="board" ${m.answerType==='board'?'selected':''}>Личная доска</option></select></div><p class="muted">Ответ сохраняется в единой работе студента.</p></div>`:active==='grading'&&!isLecture?`<div class="card" style="max-width:750px"><h2>Критерии оценивания</h2><div class="field"><label>Максимальный балл</label><input id="maxScore" type="number" min="1" max="100" value="${m.maxScore||10}"></div><p>Можно проверить работу, вернуть на доработку и опубликовать результат. Официальный журнал здесь не имитируется.</p></div>`:active==='assign'&&!isLecture?`<div class="card" style="max-width:750px"><h2>Назначение</h2><p>Учебная группа: <b>${esc(getSubject().group)}</b></p><div class="field"><label>Срок сдачи</label><input id="deadline" type="date" value="${esc(m.deadline||'')}"></div></div>`:`<div class="editor-layout"><aside class="editor-side"><h3>Структура</h3><button data-act="focusTitle">Название</button><button data-act="focusBody">${isLecture?'Содержание лекции':'Инструкция и задания'}</button><button data-act="addSnippet">+ Добавить блок</button>${isLecture?`<button data-act="insertBoard">+ Вставить доску</button><button data-act="insertPoll">+ Вопрос</button>`:''}</aside><div class="paper ${m.format==='a4'?'a4':''}"><input class="titleinput" id="materialTitle" value="${esc(m.title)}"><p class="muted">${isLecture?'Учебный материал':'Описание работы и инструкция для студента'}</p><textarea id="materialBody" rows="15" placeholder="Начните писать текст...">${esc(m.body)}</textarea><div class="soft"><b>＋ Вставить блок</b><p class="muted">Выберите инструмент сверху или нажмите «Добавить блок». Можно вставить ссылку на доску и интерактивный вопрос.</p></div></div></div>`}</div>`}
function reader(){const m=getMat();return `<div class="page">${title(m.title,'Просмотр материала · '+getSubject().name,db.role==='teacher'?button('Редактировать','editMaterial'):'')}
<div class="paper"><p style="white-space:pre-wrap">${esc(m.body)}</p>${m.type==='lecture'?`<div class="soft"><b>Вопрос для самопроверки</b><p>Для чего используется цикл?</p><button class="btn" data-act="selfCheck">Показать объяснение</button></div><p>${button('Открыть интерактивную доску','board:'+db.boardId)}</p>`:''}</div></div>`}

function laboratory(){let m=getMat(),rows=db.answers.labRows||[[6,.3],[9,.45],[12,.6]];return `<div class="page">${title(m.title,'Лабораторная работа · Измерения и расчёты')}<div class="steps"><span class="step">Подготовка</span><span class="step active">Измерения</span><span class="step">Расчёты</span><span class="step">Вывод</span></div><div class="card"><h2>Результаты измерений</h2><p>${esc(m.body)}</p><div class="tablewrap"><table class="table"><thead><tr><th>№</th><th>Напряжение U, В</th><th>Ток I, А</th><th>Сопротивление R, Ом</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><input type="number" step="any" data-row="${i}" data-col="0" class="measure" value="${esc(r[0])}" style="width:105px"></td><td><input type="number" step="any" data-row="${i}" data-col="1" class="measure" value="${esc(r[1])}" style="width:105px"></td><td>${r[1]>0?(r[0]/r[1]).toFixed(2):'—'}</td><td><button class="iconbtn" data-act="deleteLabRow:${i}" aria-label="Удалить строку">×</button></td></tr>`).join('')}</tbody></table></div><div class="toolbar" style="margin-top:15px">${button('+ Добавить измерение','addLabRow')}</div><h3>Вывод</h3><textarea id="labConclusion" style="width:100%" rows="4" placeholder="Сформулируйте вывод">${esc(db.answers.labConclusion||'')}</textarea><div class="toolbar" style="margin-top:12px">${button('Сохранить результаты','saveLab')}${button('Сдать лабораторную','submitLab','primary')}</div></div></div>`}

function normalizeBoard(b){
 if(!b||!Array.isArray(b.objects))return b;
 if(!Array.isArray(b.frames))b.frames=[];
 if(!Array.isArray(b.strokes))b.strokes=[];
 if(!Array.isArray(b.liveStrokes))b.liveStrokes=[];
 if(!Array.isArray(b.connectors))b.connectors=[];
 if(!b.frameNotes||typeof b.frameNotes!=='object')b.frameNotes={};
 const frameObjects=b.objects.filter(o=>o.type==='frame'),used=new Set();
 b.frames=b.frames.map((f,i)=>{
  let o=frameObjects.find(x=>x.id===f.id&&!used.has(x.id))||frameObjects.find(x=>!used.has(x.id));
  if(!o){const last=frameObjects.at(-1);o=newObj('frame',last?last.x+last.w+80:170,last?last.y:130);o.text=f.title||'Кадр '+(i+1);b.objects.push(o);frameObjects.push(o)}
  used.add(o.id);return {id:o.id,title:String(f.title||o.text||'Кадр '+(i+1))};
 });
 frameObjects.filter(o=>!used.has(o.id)).forEach(o=>b.frames.push({id:o.id,title:o.text||'Кадр '+(b.frames.length+1)}));
 b.activeFrame=Math.max(0,Math.min(Number(b.activeFrame)||0,b.frames.length-1));
 if(!b.poll)b.poll={text:'Ваш вопрос?',options:['Да','Нет'],correct:0,votes:[],open:false,revealed:false};
 return b;
}
function frameById(id){const b=getBoard();return b.frames.find(x=>x.id===id)}
function frameObj(id){return getBoard().objects.find(x=>x.type==='frame'&&x.id===id)}
function withinFrame(frame,obj){if(!frame||obj.type==='frame')return false;let cx=obj.x+obj.w/2,cy=obj.y+obj.h/2;return cx>=frame.x&&cx<=frame.x+frame.w&&cy>=frame.y&&cy<=frame.y+frame.h}
function frameContents(id){const o=frameObj(id);return o?getBoard().objects.filter(x=>withinFrame(o,x)):[]}
function frameUpdateTitle(id,title){const b=getBoard(),f=frameById(id),o=frameObj(id);if(!f||!o)return;title=String(title||'').trim().slice(0,100);if(!title){notify('Название кадра не может быть пустым');return}snapshot();f.title=title;o.text=title;saveBoard();notify('Название кадра сохранено')}
function frameDeleteDialog(id){const f=frameById(id),o=frameObj(id);if(!f||!o)return;if(o.locked){notify('Сначала открепите кадр');return}const contained=frameContents(id);modal(`<h2>Удалить кадр «${esc(f.title)}»?</h2><p>В кадре ${contained.length} объектов. Выберите, что сделать с ними. Штрихи маркера сохраняются отдельно.</p><div class="frame-delete-choices">${button('Удалить только кадр — оставить содержимое','frameDeleteKeep:'+id)}${button('Удалить кадр и '+contained.length+' объектов','frameDeleteAll:'+id,'red')}</div><div class="actions">${button('Отмена','closeModal','small')}</div>`)}
function frameDelete(id,deleteContents){const b=getBoard(),o=frameObj(id),f=frameById(id);if(!o||!f)return;if(o.locked){notify('Сначала открепите кадр');return}const removeIds=new Set([id]);if(deleteContents)frameContents(id).forEach(x=>removeIds.add(x.id));snapshot();b.objects=b.objects.filter(x=>!removeIds.has(x.id));dropDanglingConnectors(b);b.frames=b.frames.filter(x=>x.id!==id);b.activeFrame=Math.max(0,Math.min(b.activeFrame,b.frames.length-1));db.chosen=null;db.selectedIds=[];closeModal();saveBoard();notify('Кадр удалён. Можно отменить действие.')}
function frameDuplicate(id,copyContents){const b=getBoard(),f=frameById(id),o=frameObj(id);if(!f||!o)return;snapshot();const dx=o.w+72,dy=0;const n={...structuredClone(o),id:uid(),x:o.x+dx,y:o.y+dy,locked:false,text:f.title+' (копия)'};const inside=copyContents?frameContents(id):[];const mapped=new Map();b.objects.push(n);inside.forEach(x=>{const copied={...structuredClone(x),id:uid(),x:x.x+dx,y:x.y+dy,locked:false};mapped.set(x.id,copied.id);b.objects.push(copied)});(b.connectors||[]).slice().filter(c=>mapped.has(c.fromId)&&mapped.has(c.toId)).forEach(c=>b.connectors.push({...structuredClone(c),id:uid(),fromId:mapped.get(c.fromId),toId:mapped.get(c.toId)}));const oldIdx=b.frames.findIndex(x=>x.id===id);b.frames.splice(oldIdx+1,0,{id:n.id,title:n.text});b.activeFrame=oldIdx+1;db.chosen=n.id;closeModal();saveBoard();frameFocus(b.activeFrame);notify(copyContents?'Кадр и объекты скопированы':'Кадр скопирован')}
function frameActionsModal(id){const f=frameById(id),o=frameObj(id);if(!f||!o)return;let idx=getBoard().frames.indexOf(f);modal(`<h2>Кадр занятия</h2><div class="field"><label for="boardFrameName">Название кадра</label><input id="boardFrameName" maxlength="100" value="${esc(f.title)}"></div><div class="field" style="margin-top:12px"><label for="boardFrameNotes">Заметки преподавателя (не показываются студентам)</label><textarea id="boardFrameNotes" rows="3">${esc(getBoard().frameNotes[id]||'')}</textarea></div><div class="frame-modal-actions">${button('Сохранить название и заметки','frameSave:'+id,'primary')}${button('Дублировать кадр','frameDuplicate:'+id)}${button('← Раньше','frameEarlier:'+id)}${button('Позже →','frameLater:'+id)}${button(o.locked?'Открепить кадр':'Закрепить кадр','frameLock:'+id)}${button('Удалить кадр','frameAskDelete:'+id,'red')}</div><div class="actions">${button('Закрыть','closeModal','small')}</div>`)}
function frameMove(id,delta){const b=getBoard(),i=b.frames.findIndex(f=>f.id===id),j=i+delta;if(i<0||j<0||j>=b.frames.length)return;snapshot();[b.frames[i],b.frames[j]]=[b.frames[j],b.frames[i]];b.activeFrame=j;closeModal();saveBoard();notify('Порядок кадров изменён')}
function fitBoard(){const b=getBoard(),el=$('#boardCanvas');if(!el)return;if(!b.objects.length){db.zoom=1;db.panX=90;db.panY=60;saveBoard();return}const minX=Math.min(...b.objects.map(o=>o.x)),minY=Math.min(...b.objects.map(o=>o.y)),maxX=Math.max(...b.objects.map(o=>o.x+o.w)),maxY=Math.max(...b.objects.map(o=>o.y+o.h));const availableWidth=Math.max(250,el.clientWidth-160),availableHeight=Math.max(150,el.clientHeight-150);db.zoom=Math.max(.03,Math.min(1.5,Math.min(availableWidth/Math.max(1,maxX-minX),availableHeight/Math.max(1,maxY-minY))));db.panX=el.clientWidth/2-(minX+maxX)/2*db.zoom;db.panY=el.clientHeight/2-(minY+maxY)/2*db.zoom;saveBoard()}
function boardArrowTip(d,width=3){
 const pts=[...String(d||'').matchAll(/[ML]\s*(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g)];
 if(pts.length<2)return '';let a=pts.at(-2),b=pts.at(-1),x=+b[1],y=+b[2],dx=x-(+a[1]),dy=y-(+a[2]),len=Math.hypot(dx,dy);if(len<3)return '';
 let ux=dx/len,uy=dy/len,s=Math.min(24,12+Number(width||3)*1.5),w=s*.44;
 return `M${x-ux*s-uy*w} ${y-uy*s+ux*w} L${x} ${y} L${x-ux*s+uy*w} ${y-uy*s-ux*w}`;
}
function boardStrokePath(s){
 const d=typeof s==='string'?s:String(s.d||''),color=esc(s.color||'#0d6b61'),width=Number(s.width)||3;
 return `<path d="${esc(d)}" stroke="${color}" stroke-width="${width}"></path>${s.kind==='arrow'?`<path d="${boardArrowTip(d,width)}" stroke="${color}" stroke-width="${width}" stroke-linejoin="round"></path>`:''}`
}
function eraserAt(p,live){const b=getBoard(),arr=live?b.liveStrokes:b.strokes;for(let i=arr.length-1;i>=0;i--){const d=typeof arr[i]==='string'?arr[i]:arr[i].d||'';let pts=[...d.matchAll(/[ML]\s*(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g)];if(pts.some(m=>Math.hypot(+m[1]-p.x,+m[2]-p.y)<17)){snapshot();arr.splice(i,1);saveBoard();return true}}return false}

function boardEdgeAnchor(o,target){
 const cx=o.x+o.w/2,cy=o.y+o.h/2,tx=target.x+target.w/2,ty=target.y+target.h/2;
 const dx=tx-cx,dy=ty-cy,rx=Math.max(1,o.w/2),ry=Math.max(1,o.h/2);
 if(Math.abs(dx)+Math.abs(dy)<.00001)return {x:cx,y:cy};
 const k=o.type==='ellipse'?1/Math.sqrt(dx*dx/(rx*rx)+dy*dy/(ry*ry)):
  Math.min(dx?rx/Math.abs(dx):Infinity,dy?ry/Math.abs(dy):Infinity);
 return {x:+(cx+dx*k).toFixed(2),y:+(cy+dy*k).toFixed(2)};
}
function connectorPath(b,c){
 const f=b.objects.find(o=>o.id===c.fromId),t=b.objects.find(o=>o.id===c.toId);
 if(!f||!t)return '';
 const a=boardEdgeAnchor(f,t),z=boardEdgeAnchor(t,f);
 return `<path d="M${a.x} ${a.y} L${z.x} ${z.y}" stroke="${esc(c.color||'#0d6b61')}" stroke-width="${Number(c.width)||3}" marker-end="url(#board-link-arrow)"></path>`;
}
function boardConnectorMarkup(b){return `<g id="boardConnectorPaths">${(b.connectors||[]).map(c=>connectorPath(b,c)).join('')}</g>`}
function dropDanglingConnectors(b){const alive=new Set(b.objects.map(o=>o.id));b.connectors=(b.connectors||[]).filter(c=>alive.has(c.fromId)&&alive.has(c.toId))}
function frameMiniMap(b){if(!b.frames.length)return '';return `<div class="board-minimap" aria-label="Обзор кадров"><div><span>Обзор доски</span><span>${b.frames.length} кадр.</span></div><div class="board-minimap-map">${b.frames.map((f,i)=>{let o=b.objects.find(x=>x.id===f.id);if(!o)return '';return `<button class="board-minimap-frame ${b.activeFrame===i?'active':''}" title="Перейти к ${esc(f.title)}" aria-label="Перейти к кадру ${esc(f.title)}" data-act="frame:${i}" style="left:${Math.min(96,o.x/3000*100)}%;top:${Math.min(93,o.y/2200*100)}%;width:${Math.max(5,o.w/3000*100)}%;height:${Math.max(8,o.h/2200*100)}%"></button>`}).join('')}</div></div>`}

function boardTextColor(fill){
  const val=String(fill||'').trim().toLowerCase();
  if(!val||val==='transparent'||val==='none')return '#17211e';
  let h=val.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if(!h)return '#17211e';
  let x=h[1];if(x.length===3)x=x.split('').map(v=>v+v).join('');
  const rgb=[0,2,4].map(i=>parseInt(x.slice(i,i+2),16)/255);
  const gamma=v=>v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4);
  const l=0.2126*gamma(rgb[0])+0.7152*gamma(rgb[1])+0.0722*gamma(rgb[2]);
  const darkL=0.2126*gamma(23/255)+0.7152*gamma(33/255)+0.0722*gamma(30/255);
  return (1.05/(l+0.05)>(l+0.05)/(darkL+0.05))?'#ffffff':'#17211e';
}

function boardObject(o){const txt=o.text||'',style=`left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;background:${o.fill||'#ffffff'};color:${boardTextColor(o.fill)};font-size:${o.size||17}px;transform:rotate(${Number(o.rotation)||0}deg);opacity:${o.opacity??1};border-radius:${o.radius??9}px;border:${o.borderWidth??1}px ${o.borderStyle||'solid'} ${o.borderColor||'#8cb8aa'};font-family:${o.fontFamily==='serif'?'Georgia,serif':o.fontFamily==='monospace'?'Consolas,monospace':'Inter,system-ui,sans-serif'};font-weight:${o.fontWeight||400};box-shadow:${o.shadow?'0 8px 22px #073f3a25':'none'}`;
 const ids=db.selectedIds||[],isSelected=db.chosen===o.id||ids.includes(o.id);
 return `<div class="board-obj ${o.type} ${db.chosen===o.id?'selected':''} ${ids.length>1&&ids.includes(o.id)?'multi-selected':''} ${o.locked?'locked':''}" data-obj="${o.id}" style="${style}"><div class="obj-text" style="text-align:${o.textAlign||'center'};justify-content:${o.textAlign==='left'?'flex-start':o.textAlign==='right'?'flex-end':'center'};color:${o.textColor||boardTextColor(o.fill)}">${o.type==='image'&&o.src?`<img src="${esc(o.src)}" alt="${esc(o.text||'Изображение')}" style="max-width:100%;max-height:100%;object-fit:contain;pointer-events:none">`:esc(txt)}</div>${isSelected&&!db.live?`<div class="objmenu"><button data-act="quickEdit:${o.id}" title="Редактировать">✎</button><button data-act="duplicateObj" title="Дублировать">▣</button><button data-act="deleteSelected" title="Удалить">×</button></div>${o.locked?'':`<div class="resize" data-resize="${o.id}"></div>`}`:''}</div>`
}

function addBoardImage(){let input=document.createElement('input');input.type='file';input.accept='image/png,image/jpeg,image/webp';input.onchange=()=>{let f=input.files&&input.files[0];if(!f)return;if(f.size>750000){notify('Для автономного прототипа выберите изображение меньше 750 КБ');return}const reader=new FileReader();reader.onload=()=>{snapshot();let o={id:uid(),type:'image',x:260,y:240,w:320,h:240,text:f.name,src:String(reader.result),fill:'#ffffff'};getBoard().objects.push(o);db.chosen=o.id;db.tool='select';saveBoard();notify('Изображение добавлено')};reader.readAsDataURL(f)};input.click()}
function snapshot(){temp.snapshot.push(JSON.stringify(getBoard()));if(temp.snapshot.length>80)temp.snapshot.shift();temp.future=[]}function saveBoard(refresh=true){persist();if(refresh)draw()}function setTool(t){db.tool=t;db.chosen=null;db.selectedIds=[];db.boardToolPalette=false;saveBoard()}
function newObj(type,x,y){let defaults={text:{w:230,h:75,text:'Новый текст',fill:'transparent',size:23},heading:{w:340,h:68,text:'Заголовок',fill:'transparent',size:29},sticky:{w:190,h:150,text:'Заметка',fill:'#fff1bc'},rect:{w:225,h:110,text:'Блок схемы',fill:'#ddf4ea'},ellipse:{w:210,h:100,text:'Начало',fill:'#e6f5ef'},frame:{w:620,h:380,text:'Новый кадр',fill:'#e6f5ef'},code:{w:360,h:180,text:'for i in range(5):\n    print(i)',fill:'#e3f4ed'},poll:{w:330,h:190,text:'Быстрый вопрос\nВыберите правильный ответ',fill:'#fff'},diagram:{w:340,h:230,text:'Блок-схема\nНачало → Действие → Результат',fill:'#e6f5ef'},formula:{w:300,h:120,text:'R = U / I',fill:'#fff'},table:{w:360,h:190,text:'Показатель | Значение\nU, В | 6\nI, А | 0.3',fill:'#fff'},task:{w:340,h:175,text:'Задание группе\nОбъясните работу алгоритма',fill:'#e6f5ef'}};return {id:uid(),type,x,y,...defaults[type]||defaults.rect}}
function boardPos(ev){let rect=$('#boardCanvas').getBoundingClientRect();return {x:(ev.clientX-rect.left-db.panX)/db.zoom,y:(ev.clientY-rect.top-db.panY)/db.zoom}}

function boardBrushMove(e){const el=$('#boardCanvas'),dot=$('#boardBrushPreview');if(!el||!dot)return;
 if(!['pen','eraser'].includes(db.tool)){dot.style.display='none';return}
 let r=el.getBoundingClientRect(),w=db.tool==='eraser'?24:Math.max(6,(Number(db.penWidth)||3)*db.zoom*1.6);
 dot.style.cssText=`display:block;left:${e.clientX-r.left}px;top:${e.clientY-r.top}px;width:${w}px;height:${w}px;border-color:${db.tool==='eraser'?'#ac4856':db.penColor||'#0d6b61'};background:${db.tool==='eraser'?'#ffebee55':db.penColor||'#0d6b61'}`;
}
function boardPointerDown(e){
 const canvas=$('#boardCanvas');if(!canvas)return;
 // Middle mouse button ALWAYS pans the viewport, even over an object.
 if(e.button===1){
  temp.pointer={mode:'pan',clientX:e.clientX,clientY:e.clientY,x:db.panX,y:db.panY,middle:true};
  canvas.classList.add('is-panning');
  canvas.setPointerCapture(e.pointerId);
  e.preventDefault();e.stopPropagation();
  return;
 }
 if(e.button!==0&&e.pointerType!=='touch')return;
 const resize=e.target.closest('[data-resize]'),obj=e.target.closest('[data-obj]');if(e.target.closest('[data-act]'))return;
 const b=getBoard();
 if(resize&&!db.live){const o=b.objects.find(o=>o.id===resize.dataset.resize);if(!o||o.locked)return;snapshot();db.chosen=o.id;db.selectedIds=[o.id];temp.pointer={mode:'resize',id:o.id,start:boardPos(e),w:o.w,h:o.h};canvas.setPointerCapture(e.pointerId);e.preventDefault();return}
 if(obj&&db.tool==='select'&&!temp.spaceHeld){
  const o=b.objects.find(o=>o.id===obj.dataset.obj);if(!o)return;
  if(db.live){db.chosen=o.id;db.selectedIds=[o.id];drawBoardWithoutView();return}
  if(e.shiftKey){let chosen=new Set(db.selectedIds||[]);if(chosen.has(o.id))chosen.delete(o.id);else chosen.add(o.id);db.selectedIds=[...chosen];db.chosen=db.selectedIds.at(-1)||null;persist();draw();e.preventDefault();return}
  if(o.groupId&&!e.altKey)db.selectedIds=b.objects.filter(x=>x.groupId===o.groupId).map(x=>x.id);
  else if(e.altKey||!(db.selectedIds||[]).includes(o.id))db.selectedIds=[o.id];
  db.chosen=o.id;
  const moving=b.objects.filter(x=>db.selectedIds.includes(x.id)&&!x.locked);
  if(!moving.length){drawBoardWithoutView();return}
  snapshot();temp.pointer={mode:'move',id:o.id,start:boardPos(e),items:moving.map(x=>({id:x.id,x:x.x,y:x.y}))};
  canvas.setPointerCapture(e.pointerId);e.preventDefault();drawBoardWithoutView();return;
 }
 if(db.tool==='hand'||temp.spaceHeld){
  db.chosen=null;db.selectedIds=[];temp.pointer={mode:'pan',clientX:e.clientX,clientY:e.clientY,x:db.panX,y:db.panY};canvas.classList.add('is-panning');canvas.setPointerCapture(e.pointerId);e.preventDefault();drawBoardWithoutView();return;
 }
 if(db.tool==='select'&&!obj){
 db.chosen=null;db.selectedIds=[];let p=boardPos(e);temp.pointer={mode:'marquee',start:p,current:p};canvas.setPointerCapture(e.pointerId);e.preventDefault();drawBoardWithoutView();return;
 }
 if(db.tool==='eraser'){
  const erased=eraserAt(boardPos(e),db.live);if(!erased)notify('Наведите ластик на линию, которую хотите удалить');return;
 }
 if(db.live&&db.tool!=='pen')return;
 if(db.tool==='image'){addBoardImage();return}
 if(db.tool==='arrow'||db.tool==='pen'){

function measurementResult(b,r,c,resp){if(c.kind!=='calc')return resp[b.id+':'+r+':'+c.key]??'';const m=String(c.formula||'').replace(/\s/g,'').match(/^([A-Za-z][A-Za-z0-9_]*)([+*/-])([A-Za-z][A-Za-z0-9_]*)$/);if(!m)return '—';const a=Number(resp[b.id+':'+r+':'+m[1]]),d=Number(resp[b.id+':'+r+':'+m[3]]);if(resp[b.id+':'+r+':'+m[1]]==null||resp[b.id+':'+r+':'+m[3]]==null||!Number.isFinite(a)||!Number.isFinite(d)||(m[2]==='/'&&d===0))return '—';return Number(({'+':a+d,'-':a-d,'*':a*d,'/':d?a/d:NaN})[m[2]]).toFixed(2)}

function viewBlock(b,arr,resp){switch(b.type){case 'heading':return '<h2>'+E(b.value)+'</h2>';case 'text':case 'note':case 'equipment':case 'safety':return '<p class="c6-multiline">'+E(b.value)+'</p>';case 'code':return '<pre class="c6-code">'+E(b.value)+'</pre>';case 'image':return b.url?'<img class="c6-image" src="'+E(b.url)+'" alt="'+E(b.value||'Иллюстрация')+'">':'<p>Изображение пока не добавлено</p>';case 'video':case 'file':return b.url?'<a href="'+E(b.url)+'" target="_blank" rel="noopener noreferrer">'+E(b.value||'Открыть материал')+'</a>':'<p class="c6-hint">Материал пока не добавлен</p>';case 'board':return '<button class="btn" data-c6="open-board" data-board="'+E(b.boardId)+'">◇ Открыть интерактивную доску</button>';case 'divider':return '<hr>';case 'table':return '<pre class="c6-code">'+E(b.value)+'</pre>';case 'task':return '<h3>'+E(b.title||'Задание')+'</h3><p class="c6-multiline">'+E(b.value)+'</p>'+(b.fields||[]).map(f=>'<div class="c6-task-answer"><label>'+E(f.label)+(f.required?' *':'')+'</label>'+(f.type==='file'?'<input type="file" data-c6-response-file="'+f.id+'" data-block="'+b.id+'"><small class="c6-muted">В демо сохраняется только название файла.</small>':f.type==='board'?'<button class="btn small" data-c6="open-board" data-board="'+E(db.boards[0]?.id||'')+'">Открыть доску</button><textarea data-c6-response="'+f.id+'" data-block="'+b.id+'" rows="2" placeholder="Опишите результат на доске">'+E(resp[b.id+':'+f.id]||'')+'</textarea>':f.type==='number'?'<input type="number" data-c6-response="'+f.id+'" data-block="'+b.id+'" value="'+E(resp[b.id+':'+f.id]||'')+'">':'<textarea data-c6-response="'+f.id+'" data-block="'+b.id+'" rows="'+(f.type==='code'?7:3)+'" class="'+(f.type==='code'?'c6-code-input':'')+'" placeholder="Введите ответ">'+E(resp[b.id+':'+f.id]||'')+'</textarea>')+'</div>').join('');case 'measurement':return '<h3>'+E(b.title||'Измерения')+'</h3><div class="c6-tablewrap"><table><thead><tr><th>№</th>'+measureCols(b).map(c=>'<th>'+E(c.label  const answer=arr.map(b=>b.type==='task'?(b.title+'\n'+(b.fields||[]).map(f=>f.label+': '+String(resp[b.id+':'+f.id]||'')).join('\n')):b.type==='conclusion'?('Вывод: '+(resp[b.id+':conclusion']||'')):b.type==='measurement'?((b.title||'Измерения')+'\n'+Array.from({length:b.rows||3},(_,r)=>measureCols(b).map(c=>c.key+'='+measurementResult(b,r,c,resp)).join('; ')).join('\n')):'').filter(Boolean).join('\n\n');db.attempts.push({id:id(),materialId:m.id,student:'Студент (демо)',answer,at:Date.now(),status:'submitted'});mut();api.notify('Работа сдана. Откройте «Проверка работ» от лица преподавателя.');api.route('tasks')}
function finishQuiz(){const m=current(),arr=init(m),resp=getResponses(m);if(!window.confirm('Завершить тест и зафиксировать ответы?'))return;let correct=0,manual=0;const lines=[];for(const q of arr){const v=resp['q:'+q.id],typ=q.type||'single';let ok=false;if(typ==='single'||typ==='boolean')ok=v===q.correct;else if(typ==='multi')ok=JSON.stringify((v||[]).slice().sort())===JSON.stringify((q.corrects||[]).slice().sort());else if(typ==='numeric')ok=v!==''&&v!=null&&Number.isFinite(Number(v))&&Math.abs(Number(v)-Number(q.answer))<=Number(q.tolerance||0);else if(typ==='short')ok=String(v||'').trim().toLowerCase()===String(q.answer||'').trim().toLowerCase();else manual++;if(ok)correct++;lines.push(q.text+'\nОтвет: '+(Array.isArray(v)?v.map(i=>q.options[i]).join(', '):['single','boolean'].includes(typ)?q.options[v]??'Не ответил':String(v??'Не ответил')))}db.attempts.push({id:id(),materialId:m.id,student:'Студент (демо)',answer:'Тест: '+correct+' автоматических правильных; на ручную проверку: '+manual+'\n\n'+lines.join('\n\n'),score:correct,at:Date.now(),status:'submitted'});mut();api.notify('Тест завершён. '+(manual?'Часть ответов требует проверки преподавателем.':'Автоматически верно: '+correct));api.route('tasks')}
function handleClick(e){const btn=e.target.closest('[data-c6]');if(!btn||!btn.closest('.c6'))return;e.preventDefault();e.stopImmediatePropagation();const action=btn.dataset.c6,m=current(),arr=init(m),at=Number(btn.dataset.at),index=arr.findIndex(b=>b.id===btn.dataset.id);switch(action){case 'back':return api.route('subject');case 'preview':questionIndex=0;return api.route(m.type==='quiz'?'quiz':m.type==='lab'?'lab':'practice');case 'edit':return api.route('materialedit');case 'tab':tab=btn.dataset.tab;return refresh();case 'plus':picker=picker===at?null:at;return refresh();case 'close':picker=null;return refresh();case 'insert':arr.splice(at,0,make(btn.dataset.type));picker=null;mut();return refresh();case 'up':return move(index,index-1);case 'down':return move(index,index+1);case 'copy':if(index>=0){let clone=structuredClone(arr[index]);clone.id=id();if(clone.fields)clone.fields.forEach(f=>f.id=id());arr.splice(index+1,0,clone);mut();return refresh()}return;case 'remove':if(index<0||!confirm('Удалить этот блок? Его можно восстановить до следующего удаления.'))return;removed={mId:m.id,index,block:structuredClone(arr[index])};arr.splice(index,1);mut();feedback='Блок удалён';return refresh();case 'undo-remove':if(removed?.mId===m.id){arr.splice(removed.index,0,removed.block);removed=null;mut();return refresh()}return;case 'add-answer':{const b=arr[index];b.fields??=[];b.fields.push({id:id(),type:'text',label:'Новое поле ответа',required:true});mut();return refresh()}case 'remove-answer':{let b=arr[index];if(!b)return;b.fields=b.fields.filter(f=>f.id!==btn.dataset.field);mut();return refresh()}case 'add-option':{arr[index].options.push('Новый вариант');mut();return refresh()}case 'publish':if(!m.title?.trim()){api.notify('Введите название');return}if(!arr.length){api.notify('Добавьте содержимое');return}if(arr.some(b=>b.type==='task'&&!(b.fields||[]).length)){api.notify('Для каждого задания нужно хотя бы одно поле ответа');return}m.published=true;mut();api.notify('Опубликовано в локальном прототипе.');return refresh();case 'open-board':db.boardId=btn.dataset.board||db.boards[0]?.id;return api.route('board');case 'save-response':mut();return api.notify('Ответы сохранены в этом браузере');case 'submit':return confirmSubmit();case 'prev-q':questionIndex=Math.max(0,questionIndex-1);return refresh();case 'next-q':questionIndex=Math.min(arr.length-1,questionIndex+1);return refresh();case 'finish-quiz':return finishQuiz();}
}
document.addEventListener('click',handleClick,true);
document.addEventListener('input',e=>{const t=e.target;if(!t.closest('.c6'))return;const m=current(),arr=init(m),b=arr.find(x=>x.id===t.dataset.id);if(t.matches('[data-c6-title]'))m.title=t.value;else if(t.dataset.c6Field&&b){let val=t.value;b[t.dataset.c6Field]=t.dataset.c6Field==='rows'?Math.min(20,Math.max(1,Number(val)||1)):val;}else if(t.dataset.c6Opt!=null&&b)b.options[Number(t.dataset.c6Opt)]=t.value;else if(t.dataset.c6AnswerLabel&&b){let f=(b.fields||[]).find(f=>f.id===t.dataset.c6AnswerLabel);if(f)f.label=t.value}else if(t.dataset.c6Setting)m[t.dataset.c6Setting]=t.value;else if(t.dataset.c6Response){getResponses(m)[t.dataset.block+':'+t.dataset.c6Response]=t.value;}else if(t.dataset.c6Measure){getResponses(m)[t.dataset.c6Measure]=t.value;clearTimeout(timer);timer=setTimeout(()=>{mut();refresh()},350);return;}else if(t.dataset.c6QuizText){getResponses(m)['q:'+t.dataset.c6QuizText]=t.value}else return;clearTimeout(timer);timer=setTimeout(mut,250);},true);
document.addEventListener('change',e=>{const t=e.target;if(!t.closest('.c6'))return;const m=current(),arr=init(m),b=arr.find(x=>x.id===t.dataset.id);if(t.dataset.c6Columns&&b){b.columns=t.value.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{const a=line.split('|').map(s=>s.trim());return {label:a[0]||'',key:a[1]||'',unit:a[2]||'',kind:a[3]==='calc'?'calc':'input',formula:a[4]||''}}).filter(x=>/^[A-Za-z][A-Za-z0-9_]*$/.test(x.key));mut();return refresh()}if(t.dataset.c6AnswerType&&b){let f=(b.fields||[]).find(x=>x.id===t.dataset.c6AnswerType);if(f)f.type=t.value;}else if(t.dataset.c6AnswerRequired&&b){let f=(b.fields||[]).find(x=>x.id===t.dataset.c6AnswerRequired);if(f)f.required=t.checked}else if(t.dataset.c6Correct!=null&&b){const n=Number(t.dataset.c6Correct);if(b.type==='multi'){const s=new Set(b.corrects||[]);t.checked?s.add(n):s.delete(n);b.corrects=[...s]}else b.correct=n}else if(t.dataset.c6QuizOption!=null){const k='q:'+t.dataset.qid,r=getResponses(m);if(arr.find(q=>q.id===t.dataset.qid)?.type==='multi'){const s=new Set(r[k]||[]),v=Number(t.dataset.c6QuizOption);t.checked?s.add(v):s.delete(v);r[k]=[...s]}else r[k]=Number(t.dataset.c6QuizOption)}else if(t.dataset.c6ResponseFile){const f=t.files?.[0];getResponses(m)[t.dataset.block+':'+t.dataset.c6ResponseFile]=f?.name||'';api.notify('Сохранено имя файла. Сам файл в демоверсии не загружается.')}else if(t.dataset.c6Field==='type'&&b){b.type=t.value;b.options=b.type==='boolean'?['Верно','Неверно']:b.options||['Вариант 1','Вариант 2'];}else return;mut();refresh();},true);
document.addEventListener('dragstart',e=>{let h=e.target.closest('[data-c6-drag]');if(!h)return;const root=h.closest('.c6');if(!root)return;drag=init(current()).findIndex(x=>x.id===h.dataset.c6Drag);e.dataTransfer.effectAllowed='move';},true);
document.addEventListener('dragover',e=>{if(drag===null||!e.target.closest('.c6-block'))return;e.preventDefault();e.target.closest('.c6-block').classList.add('c6-drop');},true);
document.addEventListener('dragleave',e=>{e.target.closest('.c6-block')?.classList.remove('c6-drop');},true);
document.addEventListener('drop',e=>{if(drag===null)return;const el=e.target.closest('.c6-block');if(!el)return;e.preventDefault();const to=Number(el.dataset.index);drag===to?null:move(drag,to);drag=null;},true);
document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.c6-drop').forEach(el=>el.classList.remove('c6-drop'))},true);
window.CollegeBlocksV6={version:'6.0',getBlocks:()=>structuredClone(init(current()))};
})();

</script></body></html>
