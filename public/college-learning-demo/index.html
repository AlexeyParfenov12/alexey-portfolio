/* college subjects/list contrast fix v4.1 */
.linkrow,
.linkrow:hover,
.linkrow:focus-visible { color: var(--text) !important; }
.linkrow b,
.linkrow strong,
.linkrow:hover b,
.linkrow:focus-visible b { color: #17211e !important; }
.linkrow small,

/* v4.2: контраст и предсказуемое наследование текста на светлых поверхностях */
:root { color-scheme: light; }
input::placeholder, textarea::placeholder { color: #526960; opacity: 1; }
.card, .section, .table, .tablewrap, .paper, .modal, .editor-side, .board-inspector, .board-foot, .board-status, .board-toolbar { color: var(--text); }
.board-obj .objmenu, .board-obj .objmenu button, .board-toolbar button, .board-status button, .framechip { color: var(--text); }
.board-toolbar button.active, .board-toolbar button:hover { color: var(--primary); }
.board-live .board-head { color: #ffffff; }
.board-live .board-head .board-title { color: var(--text); }
/* Светлые элементы не должны наследовать белый цвет от режима показа. */
.board-live .board-head .iconbtn, .board-live .board-head .btn:not(.primary) { color: var(--deep); }

<div id="app" class="app"><aside class="sidebar"><div class="brand"><span class="brandmark">◈</span><span><b>College Ecosystem</b><small>Единая среда колледжа</small></span></div><nav id="nav"></nav><div class="asidefoot">Демонстрационная среда<br><small>Данные в этом браузере</small></div></aside><div class="topbar"><button class="iconbtn" id="backBtn" title="Назад">←</button><span id="breadcrumb">College Learning</span><span class="grow"></span><span class="save-status" id="saveStatus">● Локальное сохранение</span><select id="roleSelect" title="Роль"><option value="teacher">Преподаватель</option><option value="student">Студент</option></select><button class="iconbtn" id="helpBtn" title="Помощь">?</button></div><main id="view"></main></div><div id="toast" role="status"></div><div id="modalRoot"></div><script>/* College Ecosystem — interactive local prototype; no server integration */
(()=>{'use strict';
const STORAGE='college-learning-working-v4';const $=(s,root=document)=>root.querySelector(s);const $$=(s,root=document)=>[...root.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>('id'+Math.random().toString(36).slice(2,9));
const initial=()=>({role:'teacher',route:'overview',subjectId:'s1',materialId:'m1',tab:'content',boardId:'b1',tool:'select',zoom:1,panX:110,panY:70,chosen:null,live:false,answers:{},currentQuestion:0,questionEditor:0,attempts:[],reviews:[],savedAt:null,materials:[{id:'m1',subjectId:'s1',type:'lecture',title:'Лекция № 4. Циклы Python',body:'Цикл — конструкция языка программирования, которая позволяет выполнять блок команд несколько раз.\n\nЦикл for применяется, когда известна последовательность или количество повторений.\n\nПример:\nfor i in range(5):\n    print(i)\n\nПосле объяснения откройте интерактивную доску и ответьте на вопрос.',published:true,format:'web'},{id:'m2',subjectId:'s1',type:'practice',title:'Практическая работа № 3. Циклы Python',body:'Цель: научиться использовать цикл for.\n\nЗадание: напишите программу, которая выводит числа от 1 до 20 включительно, каждое число — на отдельной строке.\n\nТребования: используйте цикл for; не выводите лишние символы.',answerType:'code',published:true,format:'web',maxScore:10},{id:'m3',subjectId:'s1',type:'lab',title:'Лабораторная работа № 2. Обработка данных',body:'Исследуйте зависимость электрического тока от напряжения. Заполните таблицу измерений, рассчитайте сопротивление по формуле R = U / I и сформулируйте вывод.',published:true,format:'web'},{id:'m4',subjectId:'s1',type:'quiz',title:'Тест. Условные операторы',body:'Проверка знаний по основам Python',published:true,format:'web',questions:[{id:uid(),text:'Что выведет print(2 ** 3)?',options:['6','8','9','Ничего'],correct:1},{id:uid(),text:'Какой оператор используется для условия?',options:['for','if','print','import'],correct:1},{id:uid(),text:'Какой цикл используется для перебора элементов?',options:['for','if','def','return'],correct:0}]},{id:'m5',subjectId:'s2',type:'lecture',title:'Лекция № 1. Реляционные базы данных',body:'Реляционная база данных организует информацию в таблицы. Строки представляют записи, столбцы — атрибуты.\n\nПервичный ключ помогает однозначно идентифицировать запись.',published:true,format:'web'}],subjects:[{id:'s1',name:'Основы программирования',group:'ИС-234',period:'1 семестр',code:'ОП.05'},{id:'s2',name:'Базы данных',group:'ИС-234',period:'1 семестр',code:'ОП.08'},{id:'s3',name:'Информационные технологии',group:'ИС-235',period:'2 семестр',code:'ОП.03'}],boards:[{id:'b1',subjectId:'s1',title:'Циклы Python — интерактивная доска',frames:[{id:'f1',title:'Введение'},{id:'f2',title:'Пример'},{id:'f3',title:'Опрос'}],objects:[{id:'o1',type:'frame',x:150,y:140,w:650,h:470,text:'Кадр 1 · Введение',fill:'#e6f5ef'}, {id:'o2',type:'text',x:195,y:200,w:410,h:80,text:'Циклы в Python',size:30,fill:'transparent'},{id:'o3',type:'sticky',x:200,y:320,w:185,h:130,text:'Цикл повторяет действия много раз',fill:'#fff1c7'},{id:'o4',type:'rect',x:450,y:325,w:265,h:95,text:'for i in range(5):\n    print(i)',fill:'#e0f5ec'},{id:'o5',type:'poll',x:880,y:210,w:310,h:230,text:'Какой оператор используют для повторения?\nfor | if | print',fill:'#fff'},{id:'o6',type:'frame',x:850,y:120,w:410,h:405,text:'Кадр 2 · Вопрос',fill:'#e6f5ef'}],strokes:[],poll:{text:'Какой оператор используют для повторения?',options:['for','if','print'],correct:0,votes:[],open:false,revealed:false},activeFrame:0}]});
let db;try{db=JSON.parse(localStorage.getItem(STORAGE))||initial()}catch{db=initial()}const fallback=initial();if(!db.boards||!db.materials){db=fallback}let temp={draft:{},snapshot:[],future:[],pointer:null,stroke:null,activeTab:'content',reviewStudent:'Иванов И. А.',quizSelection:null,quizDraft:null,search:'',isImport:false};const navs=[['overview','⌂','Обзор'],['subjects','▣','Предметы'],['tasks','☑','Задания'],['reviews','▤','Проверка работ'],['boardlist','✎','Доски'],['library','▤','Материалы']];
function persist(){try{db.savedAt=Date.now();localStorage.setItem(STORAGE,JSON.stringify(db));$('#saveStatus').textContent='● Сохранено в браузере'}catch(e){$('#saveStatus').textContent='● Ошибка сохранения';notify('Не удалось сохранить: '+e.message)}}function change(mut,render=true){mut();persist();if(render)draw()}function notify(msg){const el=$('#toast');el.textContent=msg;el.style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.style.display='none',3500)}function route(to){db.route=to;db.tab='content';persist();draw()}function button(label,act,cls=''){return `<button class="btn ${cls}" data-act="${esc(act)}">${label}</button>`}function title(s,sub,actions=''){return `<div class="pagetitle"><div><h1>${esc(s)}</h1>${sub?`<p class="page-sub">${esc(sub)}</p>`:''}</div><div class="flexwrap">${actions}</div></div>`}function pill(s){return `<span class="pill ${s==='Черновик'?'gray':''}">${esc(s)}</span>`}function matIcon(t){return ({lecture:'▤',practice:'✎',lab:'⚗',quiz:'☑',board:'▣',control:'▤',project:'◈'})[t]||'▤'}function matType(t){return ({lecture:'Лекция',practice:'Практическая работа',lab:'Лабораторная работа',quiz:'Тест',board:'Доска',control:'Контрольная работа',project:'Проект'})[t]||t}function getMat(){return db.materials.find(m=>m.id===db.materialId)||db.materials[0]}function getSubject(){return db.subjects.find(s=>s.id===db.subjectId)||db.subjects[0]}function getBoard(){return db.boards.find(b=>b.id===db.boardId)||db.boards[0]}function dataRow(icon,text,meta,act,right=''){return `<button class="linkrow" data-act="${act}"><span class="colicon">${icon}</span><span style="flex:1"><b>${esc(text)}</b><br><small>${esc(meta)}</small></span>${right}<span>›</span></button>`}function renderNav(){const teacher=db.role==='teacher';$('#nav').innerHTML=navs.filter(x=>teacher||!['reviews','library'].includes(x[0])).map(([r,i,l])=>`<button class="navbtn ${db.route===r||['subject','reader','materialedit','practice','lab','quiz','quizBuilder','report'].includes(db.route)&&r==='subjects'||['board','boardLive'].includes(db.route)&&r==='boardlist'?'active':''}" data-route="${r}"><span class="ico">${i}</span><span class="label">${l}</span></button>`).join('');$('#roleSelect').value=db.role;$('#breadcrumb').textContent=['board','boardLive'].includes(db.route)?'College Board':db.route==='overview'?'Обзор':getSubject().name}
function overview(){const teacher=db.role==='teacher';const first=getSubject();return `<div class="page">${title(teacher?'Рабочее пространство преподавателя':'Моё обучение',teacher?'Ваши занятия, предметы и работы студентов':'Предметы, материалы и задания на сегодня')}
<div class="card" style="margin-bottom:18px;background:linear-gradient(105deg,#fff,#ecf9f2)"><div class="row space"><div><small>${teacher?'Ближайшая пара':'Продолжить изучение'}</small><h2 style="margin:8px 0">${esc(first.name)}</h2><small>${esc(first.group)} · Сегодня, 10:10–11:40</small></div>${button(teacher?'Открыть занятие':'Перейти к предмету','openSubject','primary')}</div></div>
<div class="grid3" style="margin-bottom:20px"><div class="dashitem" data-act="subjects"><div class="colicon">▣</div><div><small>Мои предметы</small><br><b>${db.subjects.length}</b></div></div><div class="dashitem" data-act="${teacher?'reviews':'tasks'}"><div class="colicon">☑</div><div><small>${teacher?'На проверке':'Доступных заданий'}</small><br><b>${teacher?db.attempts.filter(a=>a.status==='submitted').length:db.materials.filter(x=>x.type==='practice'||x.type==='quiz').length}</b></div></div><div class="dashitem" data-act="boardlist"><div class="colicon">✎</div><div><small>Интерактивные доски</small><br><b>${db.boards.length}</b></div></div></div>
<h2>${teacher?'Недавние материалы':'Материалы предметов'}</h2><div class="card" style="padding:0">${db.materials.filter(x=>teacher||x.published).slice(0,5).map(m=>dataRow(matIcon(m.type),m.title,matType(m.type)+' · '+(m.published?'Опубликовано':'Черновик'),'material:'+m.id)).join('')}</div></div>`}
function subjects(){return `<div class="page">${title(db.role==='teacher'?'Предметы':'Мои предметы','Учебные дисциплины и материалы')}
<div class="card" style="padding:0">${db.subjects.map(s=>dataRow('▣',s.name,`${s.code} · ${s.group} · ${s.period}`,'subject:'+s.id)).join('')}</div></div>`}
function subject(){let s=getSubject();let mats=db.materials.filter(m=>m.subjectId===s.id&&(db.role==='teacher'||m.published));let teacher=db.role==='teacher';return `<div class="page">${title(s.name,s.code+' · '+s.group+' · '+s.period,teacher?button('+ Добавить материал','newMaterial','primary'):'')}<div class="tabs">${['Содержание','Задания','Результаты','О предмете'].map((x,i)=>`<button class="tab ${db.tab===['content','tasks','results','about'][i]?'active':''}" data-act="tab:${['content','tasks','results','about'][i]}">${x}</button>`).join('')}</div>${db.tab==='about'?`<div class="card"><h2>О предмете</h2><p>Учебная дисциплина ${esc(s.code)}, группа ${esc(s.group)}.</p><p>Материалы доступны в рамках учебного назначения.</p></div>`:db.tab==='results'?report():`<div class="section"><div class="section-title">Раздел 1. Основы ${esc(s.name)}</div>${mats.filter(m=>db.tab==='content'||m.type!=='lecture').map(m=>dataRow(matIcon(m.type),m.title,matType(m.type), 'material:'+m.id, teacher?pill(m.published?'Опубликовано':'Черновик'):'' )).join('')||'<div class="empty">Материалов пока нет</div>'}</div><div class="section"><div class="section-title">Интерактивные доски</div>${db.boards.filter(b=>b.subjectId===s.id).map(b=>dataRow('✎',b.title,`${b.frames.length} кадров`,'board:'+b.id)).join('')||'<p style="padding:15px">Досок пока нет</p>'}</div>`}</div>`}

function materialLanding(){let m=getMat(),teacher=db.role==='teacher';return `<div class="page">${title(m.title,matType(m.type)+' · '+(m.published?'Опубликовано':'Черновик'),teacher?button('Редактировать','editMaterial')+button('Посмотреть как студент','openView','primary'):button(m.type==='quiz'?'Начать тест':m.type==='lecture'?'Читать лекцию':'Выполнить','openView','primary'))}<div class="card"><p style="white-space:pre-wrap">${esc(m.body)}</p><div class="toolbar">${teacher?button('Изменить','editMaterial')+button('Опубликовать','publishMaterial'):button('Открыть','openView','primary')}</div></div></div>`}

${active==='answer'&&!isLecture?`<div class="card" style="max-width:750px"><h2>Способ ответа студента</h2><div class="field"><label>Тип ответа</label><select id="answerType"><option value="text" ${m.answerType==='text'?'selected':''}>Текст</option><option value="code" ${m.answerType==='code'?'selected':''}>Редактор кода</option><option value="file" ${m.answerType==='file'?'selected':''}>Загрузка файла</option><option value="board" ${m.answerType==='board'?'selected':''}>Личная доска</option></select></div><p class="muted">Ответ сохраняется в единой работе студента.</p></div>`:active==='grading'&&!isLecture?`<div class="card" style="max-width:750px"><h2>Критерии оценивания</h2><div class="field"><label>Максимальный балл</label><input id="maxScore" type="number" min="1" max="100" value="${m.maxScore||10}"></div><p>Можно проверить работу, вернуть на доработку и опубликовать результат. Официальный журнал здесь не имитируется.</p></div>`:active==='assign'&&!isLecture?`<div class="card" style="max-width:750px"><h2>Назначение</h2><p>Учебная группа: <b>${esc(getSubject().group)}</b></p><div class="field"><label>Срок сдачи</label><input id="deadline" type="date" value="${esc(m.deadline||'')}"></div></div>`:`<div class="editor-layout"><aside class="editor-side"><h3>Структура</h3><button data-act="focusTitle">Название</button><button data-act="focusBody">${isLecture?'Содержание лекции':'Инструкция и задания'}</button><button data-act="addSnippet">+ Добавить блок</button>${isLecture?`<button data-act="insertBoard">+ Вставить доску</button><button data-act="insertPoll">+ Вопрос</button>`:''}</aside><div class="paper ${m.format==='a4'?'a4':''}"><input class="titleinput" id="materialTitle" value="${esc(m.title)}"><p class="muted">${isLecture?'Учебный материал':'Описание работы и инструкция для студента'}</p><textarea id="materialBody" rows="15" placeholder="Начните писать текст...">${esc(m.body)}</textarea><div class="soft"><b>＋ Вставить блок</b><p class="muted">Выберите инструмен function quizBuilder(){let m=getMat(),qs=m.questions||[];return `<div class="page">${title('Конструктор теста',m.title,button('Предпросмотр','openView')+button('Опубликовать','publishMaterial','primary'))}<div class="card"><div class="field"><label>Название теста</label><input id="materialTitle" value="${esc(m.title)}"></div><div class="grid2" style="margin:15px 0"><div class="field"><label>Время (минут)</label><input id="quizMinutes" type="number" value="${m.minutes||20}"></div><div class="field"><label>Попытки</label><input id="quizAttempts" type="number" value="${m.allowedAttempts||2}"></div></div></div><h2 style="margin-top:20px">Вопросы · ${qs.length}</h2>${qs.map((q,i)=>`<div class="card"><div class="row space"><b>${i+1}. ${esc(q.text)}</b><div>${button('Изменить','editQuestion:'+i,'small')}${button('Удалить','removeQuestion:'+i,'small red')}</div></div><p class="muted">${q.options.map((x,j)=>(j===q.correct?'✓ ':'')+x).join(' · ')}</p></div>`).join('')}<div class="toolbar" style="margin-top:18px">${button('+ Добавить вопрос','addQuestion','primary')}${button('Пройти тест','openView')}</div></div>`}
function questionEditor(){const m=getMat(),q=m.questions[temp.questionEditor];if(!q){return `<div class="page"><p>Вопрос не найден</p></div>`}return `<div class="page">${title('Редактор вопроса','Тест · '+m.title,button('Назад к тесту','editMaterial')+button('Сохранить','saveQuestion','primary'))}<div class="card" style="max-width:800px"><div class="fields"><div class="field"><label>Формулировка</label><textarea id="questionText" rows="3">${esc(q.text)}</textarea></div><div class="field"><label>Варианты ответа</label>${q.options.map((x,i)=>`<div class="row"><input type="radio" name="correctQuestion" value="${i}" ${q.correct===i?'checked':''} title="Правильный ответ"><input class="questionOpt" value="${esc(x)}" style="flex:1"><button class="iconbtn" data-act="removeOption:${i}">×</button></div>`).join('')}${button('+ Добавить вариант','addOption')}</div><p class="smallnote">Отметьте правильный вариант кружком слева.</p></div></div></div>`}

function reviews(){let submitted=db.attempts.slice().reverse();return `<div class="page">${title('Проверка работ','Отправленные решения студентов')}${submitted.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Студент</th><th>Работа</th><th>Сдана</th><th>Статус</th><th></th></tr></thead><tbody>${submitted.map(a=>`<tr><td>${esc(a.student)}</td><td>${esc((db.materials.find(m=>m.id===a.materialId)||{}).title)}</td><td>${new Date(a.at).toLocaleString('ru-RU')}</td><td>${pill(a.status==='submitted'?'Ожидает проверки':a.status==='returned'?'На доработку':'Проверено')}</td><td>${button('Проверить','review:'+a.id,'small')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">Пока нет сданных работ. Переключитесь на роль студента и сдайте практическую.</div>'}</div>`}

function boardList(){return `<div class="page">${title('Интерактивные доски','Подготовка и проведение занятий',db.role==='teacher'?button('+ Создать доску','newBoard','primary'):'')}<div class="card" style="padding:0">${db.boards.map(b=>dataRow('✎',b.title,`${b.objects.length} объектов · ${b.frames.length} кадров`,'board:'+b.id)).join('')}</div></div>`}
function boardMarkup(){let b=getBoard(),sel=b.objects.find(o=>o.id===db.chosen);let tools=[['select','↖','Выделение (V)'],['hand','✋','Рука (H)'],['pen','✎','Маркер (P)'],['eraser','⌫','Ластик (E)'],['arrow','↗','Стрелка и связь (C)'],['image','▧','Изображение'],['text','T','Текст (T)'],['sticky','▣','Стикер (N)'],['rect','□','Прямоугольник (S)'],['ellipse','◯','Овал'],['frame','▥','Кадр (F)'],['code','</>','Код'],['poll','?','Вопрос (Q)']];return `<div class="board-app ${db.live?'board-live':''}"><div class="board-head"><button class="iconbtn" data-act="boardlist">←</button><input class="board-title" id="boardTitle" value="${esc(b.title)}" aria-label="Название доски"><span class="grow"></span>${!db.live?button('Отменить','undo','small')+button('Вернуть','redo','small')+button('Интерактивный опрос','pollSetup','small')+button('Импорт / экспорт','boardIO','small')+button('Провести занятие','toggleLive','primary'):button('Запустить опрос','pollSetup','small')+button('Вернуться в редактор','toggleLive','primary')}</div>
<div class="board-main"><div class="board-canvas" id="boardCanvas"><div class="board-world" id="boardWorld" style="transform:translate(${db.panX}px,${db.panY}px) scale(${db.zoom})"><svg class="draw-svg" id="drawSvg" xmlns="http://www.w3.org/2000/svg"><g id="storedPaths">${b.strokes.map(st=>`<path d="${esc(st)}"></path>`).join('')}</g><path id="temporaryPath" d=""></path></svg>${b.objects.map(o=>boardObject(o)).join('')}</div></div>
<div class="board-toolbar" aria-label="Инструменты доски">${tools.filter(x=>!db.live||['hand','pen','select'].includes(x[0])).map(([tool,icon,label])=>`<button data-tool="${tool}" title="${esc(label)}" class="${db.tool===tool?'active':''}">${icon}</button>`).join('')}<button data-act="deleteSelected" title="Удалить выбранное (Delete)" ${!sel?'disabled':''}>⌫</button></div>
${!db.live&&sel?`<div class="board-inspector"><div class="row space"><b>Свойства объекта</b><button class="iconbtn" data-act="deselect">×</button></div><label>Тип</label><b>${esc(sel.type)}</b><label>Текст</label><textarea id="objText" rows="4" style="width:100%">${esc(sel.text||'')}</textarea><label>Заливка</label><input type="color" id="objColor" value="${sel.fill==='transparent'?'#ffffff':sel.fill||'#ffffff'}"><label>Размер текста</label><input id="objFontSize" type="number" min="9" max="62" value="${sel.size||17}"><div class="toolbar" style="margin-top:14px">${sel.type==='poll'?button('Настроить опрос','pollSetup','small'):''}${button('Дублировать','duplicateObj','small')}${button('Удалить','deleteSelected','small red')}</div><small>Переместите объект мышью. Квадрат справа снизу изменяет размер. Двойной клик редактирует текст.</small></div>`:''}
<div class="board-status">${button('−','zoomOut','small flat')}<span id="zoomLabel">${Math.round(db.zoom*100)}%</span>${button('+','zoomIn','small flat')}${button('Вписать','zoomFit','small flat')}</div></div><div class="board-foot"><b style="white-space:nowrap">Кадры занятия</b>${b.frames.map((f,i)=>`<button class="framechip ${i===b.activeFrame?'active':''}" data-act="frame:${i}">${i+1}. ${esc(f.title)}</button>`).join('')}${!db.live?button('+ Кадр','addFrame','small'):''}<span class="grow"></span>${button('◀','prevFrame','small')}${button('▶','nextFrame','small')}</div></div>`}
function boardTextColor(fill){
  const val=String(fill||'').trim().toLowerCase();
  if(!val||val==='transparent'||val==='none')return '#17211e';
  let h=val.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if(!h)return '#17211e';
  let x=h[1];if(x.length===3)x=x.split('').map(v=>v+v).join('');
  const rgb=[0,2,4].map(i=>parseInt(x.slice(i,i+2),16)/255);
  const gamma=v=>v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4);
  const l=0.2126*gamma(rgb[0])+0.7152*gamma(rgb[1])+0.0722*gamma(rgb[2]);
  const darkL=0.2126*gamma(23/255)+0.7152*gamma(33/255)+0.0722*gamma(30/255);
  return (1.05/(l+0.05)>(l+0.05)/(darkL+0.05))?'#ffffff':'#17211e';
}
function boardObject(o){let txt=o.text||'',style=`left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;background:${o.fill||'#ffffff'};color:${boardTextColor(o.fill)};font-size:${o.size||17}px`;return `<div class="board-obj ${o.type} ${db.chosen===o.id?'selected':''}" data-obj="${o.id}" style="${style}"><div class="obj-text">${o.type==='image'&&o.src?`<img src="${esc(o.src)}" alt="${esc(o.text||'Изображение')}" style="max-width:100%;max-height:100%;object-fit:contain;pointer-events:none">`:esc(txt)}</div>${db.chosen===o.id&&!db.live?`<div class="objmenu"><button data-act="quickEdit:${o.id}" title="Редактировать">✎</button><button data-act="duplicateObj" title="Дублировать">▣</button><button data-act="deleteSelected" title="Удалить">×</button></div><div class="resize" data-resize="${o.id}"></div>`:''}</div>`}
function addBoardImage(){let input=document.createElement('input');input.type='file';input.accept='image/png,image/jpeg,image/webp';input.onchange=()=>{let f=input.files&&input.files[0];if(!f)return;if(f.size>750000){notify('Для автономного прототипа выберите изображение меньше 750 КБ');return}const reader=new FileReader();reader.onload=()=>{snapshot();let o={id:uid(),type:'image',x:260,y:240,w:320,h:240,text:f.name,src:String(reader.result),fill:'#ffffff'};getBoard().objects.push(o);db.chosen=o.id;db.tool='select';saveBoard();notify('Изображение добавлено')};reader.readAsDataURL(f)};input.click()}
function snapshot(){temp.snapshot.push(JSON.stringify(getBoard()));if(temp.snapshot.length>80)temp.snapshot.shift();temp.future=[]}function saveBoard(refresh=true){persist();if(refresh)draw()}function setTool(t){db.tool=t;db.chosen=null;saveBoard()}
function newObj(type,x,y){let defaults={text:{w:230,h:75,text:'Новый текст',fill:'transparent',size:23},sticky:{w:190,h:150,text:'Заметка',fill:'#fff1bc'},rect:{w:225,h:110,text:'Блок схемы',fill:'#ddf4ea'},ellipse:{w:210,h:100,text:'Начало',fill:'#e6f5ef'},frame:{w:620,h:380,text:'Новый кадр',fill:'#e6f5ef'},code:{w:360,h:180,text:'for i in range(5):\n    print(i)',fill:'#e3f4ed'},poll:{w:330,h:190,text:'Быстрый вопрос\nВыберите правильный ответ',fill:'#fff'}};return {id:uid(),type,x,y,...defaults[type]||defaults.rect}}
function boardPos(ev){let rect=$('#boardCanvas').getBoundingClientRect();return {x:(ev.clientX-rect.left-db.panX)/db.zoom,y:(ev.clientY-rect.top-db.panY)/db.zoom}}
function boardPointerDown(e){if(e.button!==0&&e.pointerType!=='touch')return;const canvas=$('#boardCanvas');if(!canvas)return;const resize=e.target.closest('[data-resize]'),obj=e.target.closest('[data-obj]');if(e.target.closest('[data-act]'))return;if(resize){let o=getBoard().objects.find(o=>o.id===resize.dataset.resize);if(!o)return;snapshot();db.chosen=o.id;temp.pointer={mode:'resize',id:o.id,start:boardPos(e),w:o.w,h:o.h};canvas.setPointerCapture(e.pointerId);e.preventDefault();return}if(obj&&db.tool==='select'){let o=getBoard().objects.find(o=>o.id===obj.dataset.obj);if(!o)return;snapshot();db.chosen=o.id;temp.pointer={mode:'move',id:o.id,start:boardPos(e),x:o.x,y:o.y};canvas.setPointerCapture(e.pointerId);e.preventDefault();drawBoardWithoutView();return}
if(db.tool==='hand'||db.tool==='select'&&e.target===canvas||db.tool==='select'&&e.target.id==='boardWorld'){db.chosen=null;temp.pointer={mode:'pan',clientX:e.clientX,clientY:e.clientY,x:db.panX,y:db.panY};canvas.setPointerCapture(e.pointerId);e.preventDefault();drawBoardWithoutView();return}
if(db.tool==='eraser'){snapshot();if(getBoard().strokes.length){getBoard().strokes.pop();saveBoard();notify('Последний штрих удалён')}else notify('Штрихов для удаления нет');return}
if(db.tool==='image'){addBoardImage();return}
if(db.tool==='arrow'){snapshot();const p=boardPos(e);temp.pointer={mode:'arrow',start:p};temp.stroke=`M${p.x.toFixed(1)} ${p.y.toFixed(1)} L${p.x.toFixed(1)} ${p.y.toFixed(1)}`;canvas.setPointerCapture(e.pointerId);e.preventDefault();return}

/* College Learning lecture blocks v5 — local demo enhancement, no backend */
(() => {
  'use strict';
  const api = window.CollegeLectureAPI;
  if (!api) return;

  const $ = (q,root=document) => root.querySelector(q);
  const esc = api.esc;
  const types = [
    ['text','Текст','Абзацы и объяснения','T'],

  function initialBlock(type) {

  function field(b,name,placeholder='',height=0) {

  function tableHTML(s){const rows=(s||'').split('\n').filter(Boolean).slice(0,15).map(x=>x.split(';'));return `<table>${rows.map((r,i)=>`<tr>${r.map(c=>`<${i===0?'th':'td'}>${esc(c.trim())}</${i===0?'th':'td'}>`).join('')}</tr>`).join('')}</table>`}

  }
  function plusHTML(at){return `<div class="lecture-plus-position"><button type="button" class="lecture-plus ${pickerAt===at?'active':''}" data-lecture="plus" data-at="${at}" aria-label="Добавить блок после позиции ${at}"><span class="lecture-plus-round">+</span><span>${at===0?'Добавить первый блок':'Добавить блок'}</span></button>${pickerAt===at?pickerHTML(at):''}</div>`}
  function pickerHTML(at){return `<div class="lecture-picker"><div class="lecture-picker-head"><b>Что добавить?</b><button data-lecture="close-picker" class="lecture-control">×</button></div><input data-lecture-search="1" placeholder="Найти блок: текст, тест, видео…" value="${esc(search)}"><div class="lecture-picker-items">${types.filter(x=>(x[1]+' '+x[2]).toLowerCase().includes(search.toLowerCase())).map(x=>`<button type="button" data-lecture="insert" data-at="${at}" data-type="${x[0]}"><span class="lecture-option-icon">${esc(x[3])}</span><span><b>${esc(x[1])}</b><small>${esc(x[2])}</small></span></button>`).join('')||'<p class="lecture-placeholder">Ничего не найдено</p>'}</div></div>`;}
  function refreshBlocks(){const root=$('.lecture-v5');if(!root)return;const m=mat();const bs=blocks(m);const stack=$('.lecture-stack',root);stack.innerHTML=bs.map((b,i)=>blockHTML(b,i)+plusHTML(i+1)).join('')||(plusHTML(0));if(bs.length&&pickerAt===0){pickerAt=null;refreshBlocks();}}
  function renderEditor(){const m=mat();const bs=blocks(m);const a4=m.format==='a4';const isScenes=m.format==='slides';
    view.innerHTML=`<div class="page wide lecture-v5"><div class="lecture-editor-top"><button class="btn small" data-lecture="back">← К предмету</button><span class="lecture-spacer"></span><button class="btn small" data-lecture="preview">Предпросмотр студента</button><button class="btn primary small" data-lecture="publish">Опубликовать</button></div><div class="lecture-document ${a4?'lecture-a4':''} ${isScenes?'lecture-scenes':''}"><div class="lecture-caption">РЕДАКТОР ЛЕКЦИИ · КОНСТРУКТОР БЛОКОВ</div><input id="lectureTitleV5" class="lecture-title" value="${esc(m.title)}" aria-label="Название лекции"><div class="lecture-format"><label>Представление <select id="lectureFormatV5"><option value="web" ${m.format==='web'?'selected':''}>Веб-лекция</option><option value="a4" ${a4?'selected':''}>Страницы А4</option><option value="slides" ${isScenes?'selected':''}>Презентация</option><option value="mixed" ${m.format==='mixed'?'selected':''}>Смешанная лекция</option></select></label><span class="lecture-muted">Нажмите «+» под блоком, чтобы добавить следующий</span></div><div class="lecture-stack">${bs.map((b,i)=>blockHTML(b,i)+plusHTML(i+1)).join('')||plusHTML(0)}</div><p class="lecture-footnote">Изменения сохраняются в этом браузере. Чтобы показать лекцию студенту, опубликуйте её.</p></div></div>`;
  }
  function readBody(b,m){const answerKey='lecture-response:'+m.id+':'+b.id;const answer=api.getState().answers[answerKey];switch(b.type){
    case 'heading':return `<h2>${esc(b.value)}</h2>`;
    case 'text':return `<p class="lecture-read-text">${esc(b.value).replaceAll('\n','<br>')}</p>`;
    case 'quote':return `<blockquote>${esc(b.value)}</blockquote>`;
    case 'code':return `<pre class="lecture-read-code"><code>${esc(b.value)}</code></pre>`;
    case 'image':return b.url?`<img class="lecture-image" src="${esc(b.url)}" alt="Иллюстрация лекции">`:'<p>Изображение недоступно</p>';
    case 'video':return b.url?`<p><a href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">▶ Открыть видео</a></p>`:'<p>Видео не добавлено</p>';
    case 'board':return `<div class="lecture-embed">◇ <b>Интерактивная доска</b><button class="btn" data-lecture="open-board" data-block="${b.id}">Открыть доску</button></div>`;
    case 'file':return b.url?`<a href="${esc(b.url)}" download="${esc(b.fileName||'material')}">▤ Скачать ${esc(b.fileName||'файл')}</a>`:'<p>Файл не добавлен</p>';
    case 'table':return tableHTML(b.value);
    case 'divider':return '<hr>';
    case 'question':case 'poll':return `<div class="lecture-check"><b>${esc(b.type==='poll'?'Опрос':'Проверка знаний')}</b><p>${esc(b.value)}</p>${(b.options||[]).map((x,i)=>`<label><input type="radio" name="q_${b.id}" value="${i}" ${String(answer)===String(i)?'checked':''}> ${esc(x)}</label>`).join('')}<button class="btn small" data-lecture="answer" data-block="${b.id}">${answer===undefined?'Ответить':'Изменить ответ'}</button>${answer!==undefined?`<small class="lecture-answer-note">Ваш ответ сохранён в локальном прототипе.${b.type==='question'?' Верный ответ можно узнать после проверки преподавателя.':''}</small>`:''}</div>`;
    default:return `<p>${esc(b.value||'')}</p>`;
  }}
  function renderReader(){const m=mat();const bs=blocks(m);view.innerHTML=`<div class="page lecture-v5"><div class="lecture-editor-top"><button class="btn small" data-lecture="back-reader">← К предмету</button><span class="lecture-spacer"></span>${api.getState().role==='teacher'?'<button class="btn small" data-lecture="edit">Редактировать</button>':''}</div><article class="lecture-document lecture-reading"><div class="lecture-caption">ЛЕКЦИЯ · ${m.published?'ОПУБЛИКОВАНО':'ПРЕДПРОСМОТР'}</div><h1>${esc(m.title)}</h1>${bs.map(b=>`<section class="lecture-read-block">${readBody(b,m)}</section>`).join('')||'<p>Материал пока не заполнен.</p>'}</article></div>`;}
  function enhance(){const s=api.getState(),m=api.getMat();if(!m||m.type!=='lecture')return;if(s.route==='materialedit'&&!$('.lecture-v5',view)){pickerAt=null;renderEditor();lastRoute='materialedit'}else if(s.route==='reader'&&!$('.lecture-v5',view)){renderReader();lastRoute='reader';}}
  const observer=new MutationObserver(()=>enhance());observer.observe(view,{childList:true});enhance();
  function reorder(from,to){const a=blocks(mat());if(from<0||to<0||from>=a.length||to>=a.length||from===to)return;const [item]=a.splice(from,1);a.splice(to,0,item);api.persist();pickerAt=null;refreshBlocks();api.notify('Порядок блоков сохранён')}
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-lecture]');if(!t)return;if(!$('.lecture-v5'))return;
    e.preventDefault();e.stopImmediatePropagation();const m=mat(),bs=blocks(m),key=t.dataset.lecture,b=bs.find(x=>x.id===t.dataset.block),at=Number(t.dataset.at);

      case 'plus':pickerAt=pickerAt===at?null:at;search='';refreshBlocks();if(pickerAt!==null)$('[data-lecture-search]')?.focus();return;

      case 'insert':{const nb=initialBlock(t.dataset.type);bs.splice(at,0,nb);api.persist();pickerAt=null;search='';refreshBlocks();const el=$(`[data-lecture-block="${nb.id}"]`);el?.scrollIntoView({block:'nearest',behavior:'smooth'});el?.querySelector('textarea,input')?.focus();return;}

    }

  document.addEventListener('input',e=>{const t=e.target;if(!t.closest('.lecture-v5'))return;const m=mat();if(t.id==='lectureTitleV5'){m.title=t.value;save();return}if(t.hasAttribute('data-lecture-search')){search=t.value;const box=$('.lecture-picker-items');if(box)box.innerHTML=types.filter(x=>(x[1]+' '+x[2]).toLowerCase().includes(search.toLowerCase())).map(x=>`<button data-lecture="insert" data-at="${pickerAt}" data-type="${x[0]}"><span class="lecture-option-icon">${esc(x[3])}</span><span><b>${esc(x[1])}</b><small>${esc(x[2])}</small></span></button>`).join('')||'<p class="lecture-placeholder">Ничего не найдено</p>';return}
    const b=blocks(m).find(x=>x.id===t.dataset.block);if(!b||!t.dataset.lectureField)return;const k=t.dataset.lectureField;b[k]=k==='options'?t.value.split('\n').filter(Boolean):k==='correct'?Number(t.value):t.value;save();
  },true);
  document.addEventListener('change',async e=>{const t=e.target;if(!t.closest('.lecture-v5'))return;const m=mat();if(t.id==='lectureFormatV5'){m.format=t.value;api.persist();renderEditor();return}if(t.dataset.lectureField==='boardId'){const b=blocks(m).find(x=>x.id===t.dataset.block);if(b){b.boardId=t.value;api.persist();refreshBlocks()}return}
    if(!t.dataset.lectureUpload||!t.files?.length)return;const f=t.files[0];if(f.size>800000){api.notify('Для локального прототипа выберите файл до 800 КБ');t.value='';return;}const b=blocks(m).find(x=>x.id===t.dataset.block);if(!b)return;const reader=new FileReader();reader.onload=()=>{b.url=reader.result;b.fileName=f.name;api.persist();refreshBlocks();api.notify('Файл добавлен в блок')};reader.onerror=()=>api.notify('Не удалось прочитать файл');reader.readAsDataURL(f);

  document.addEventListener('dragend',()=>{dragFrom=-1;document.querySelectorAll('.lecture-drop-target').forEach(x=>x.classList.remove('lecture-drop-target'))},true);
  window.CollegeLectureV5={version:'5.0',getBlocks:()=>structuredClone(blocks(mat()))};
})();
</script></body></html>
